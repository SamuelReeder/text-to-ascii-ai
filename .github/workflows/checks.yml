name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run the released model on CPU (downloads 112 MB)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/image.txt -r requirements/dev.txt
      - run: python -m pytest -q
        env:
          HF_HUB_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - run: bash -n setup.sh scripts/reproduce.sh && python -m compileall -q ascii.py asciiart demo scripts tests
  released-model:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/image.txt -r requirements/dev.txt
      - run: python -c "from asciiart.neural import download_checkpoint; download_checkpoint()"
      - run: python -m pytest -q -m integration -k neural
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
